[workspace]
members = [
	"blob-stream-broker-discovery",
	"blob-stream-broker",
	"blob-stream-blob-store",
	"blob-stream-metadata-store",
	"blob-stream-consumer",
	"blob-stream-integration-tests",
	"blob-stream-producer",
	"blob-stream-proto",
	"blob-stream-types",
]
resolver = "2"

[workspace.dependencies]
anyhow               = "1.0.102"
async-trait          = "0.1.89"
aws-config           = "1.8.15"
aws-sdk-dynamodb     = "1.108.0"
aws-sdk-s3           = "1.125.0"
aws-types            = "1.3.14"
axum                 = { version = "0.8.8", features = ["http2", "macros"] }
bd-grpc.path         = "../shared-core/bd-grpc"
bd-log.path          = "../shared-core/bd-log"
bd-panic.path        = "../shared-core/bd-panic"
bd-rt.path           = "../shared-core/bd-rt"
bd-server-stats.path = "../shared-core/bd-server-stats"
bd-test-helpers.path = "../shared-core/bd-test-helpers"
bd-time.path         = "../shared-core/bd-time"
bytes                = "1.11.1"
clap                 = { version = "4.5.60", features = ["derive", "env"] }
ctor                 = "0.6.3"
futures              = "0.3.32"
hostname             = "0.4.2"
http                 = "1.4.0"
k8s-openapi          = { version = "0.27.1", features = ["v1_31"] }
kube                 = { version = "3.0.1", features = ["runtime"] }
log                  = "0.4.29"
mockall              = "0.14.0"
prometheus           = "0.14.0"

protobuf = { git = "https://github.com/bitdriftlabs/rust-protobuf.git", branch = "patch-stack", features = [
	"with-bytes",
] }
protobuf-codegen = { git = "https://github.com/bitdriftlabs/rust-protobuf.git", branch = "patch-stack" }
protobuf-json-mapping = { git = "https://github.com/bitdriftlabs/rust-protobuf.git", branch = "patch-stack" }

serde             = { version = "1.0.228", features = ["derive"] }
serde_dynamo      = "4.3.0"
serde_json        = { version = "1.0.149" }
serde_yaml        = "0.9.34"
sonyflake         = { git = "https://github.com/mattklein123/sonyflake-rs.git" }
thiserror         = "2.0.18"
tikv-jemallocator = "0.6.1"
time              = { version = "0.3.47", features = ["serde-well-known", "macros", "parsing"] }
tokio             = { version = "1.50.0", features = ["full"] }
tokio-stream      = "0.1.18"
uuid              = { version = "1.22.0", features = ["v4"] }
zstd              = "0.13.3"
