[workspace]
members = [
	"blob-stream-broker",
	"blob-stream-blob-store",
	"blob-stream-metadata-store",
	"blob-stream-proto",
	"blob-stream-types",
]
resolver = "2"

[workspace.dependencies]
anyhow           = "1.0.100"
async-trait      = "0.1.89"
aws-config       = "1.6.0"
aws-sdk-dynamodb = "1.78.0"
aws-sdk-s3       = "1.78.0"
axum             = { version = "0.8.8", features = ["http2", "macros"] }
bd-grpc.path     = "../shared-core/bd-grpc"
bd-log.path      = "../shared-core/bd-log"
bytes            = "1.11.0"
clap             = { version = "4.5.48", features = ["derive", "env"] }
http             = "1.4.0"
log              = "0.4.29"
mockall          = "0.13.1"

protobuf = { git = "https://github.com/bitdriftlabs/rust-protobuf.git", branch = "patch-stack", features = [
	"with-bytes",
] }
protobuf-codegen = { git = "https://github.com/bitdriftlabs/rust-protobuf.git", branch = "patch-stack" }
protobuf-json-mapping = { git = "https://github.com/bitdriftlabs/rust-protobuf.git", branch = "patch-stack" }

serde        = { version = "1.0.228", features = ["derive"] }
serde_dynamo = "4.2.14"
serde_json   = { version = "1.0.149" }
serde_yaml   = "0.9.34"
time         = { version = "0.3.44", features = ["serde-well-known", "macros", "parsing"] }
tokio        = { version = "1.49.0", features = ["full"] }
uuid         = { version = "1.18.1", features = ["v4"] }
