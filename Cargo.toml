[workspace]
members = [
	"blob-stream-broker-discovery",
	"blob-stream-broker",
	"blob-stream-blob-store",
	"blob-stream-metadata-store",
	"blob-stream-consumer",
	"blob-stream-integration-tests",
	"blob-stream-producer",
	"blob-stream-proto",
	"blob-stream-types",
]
resolver = "2"

[workspace.dependencies]
anyhow           = "1.0.103"
async-trait      = "0.1.89"
aws-config       = "1.9.0"
aws-sdk-dynamodb = "1.117.0"
aws-sdk-s3       = "1.138.0"
aws-types        = "1.4.0"
axum             = { version = "0.8.9", features = ["http2", "macros"] }
bd-grpc          = { git = "ssh://git@github.com/bitdriftlabs/shared-core" }
bd-log           = { git = "ssh://git@github.com/bitdriftlabs/shared-core" }
bd-panic         = { git = "ssh://git@github.com/bitdriftlabs/shared-core" }
bd-pgv           = { git = "ssh://git@github.com/bitdriftlabs/shared-core" }
bd-rt            = { git = "ssh://git@github.com/bitdriftlabs/shared-core" }
bd-server-stats  = { git = "ssh://git@github.com/bitdriftlabs/shared-core" }
bd-test-helpers  = { git = "ssh://git@github.com/bitdriftlabs/shared-core" }
bd-time          = { git = "ssh://git@github.com/bitdriftlabs/shared-core" }
bytes            = "1.12.1"
clap             = { version = "4.6.1", features = ["derive", "env"] }
ctor             = "1.0.8"
futures          = "0.3.32"
hostname         = "0.4.2"
http             = "1.4.2"
k8s-openapi      = { version = "0.28.0", features = ["v1_32"] }
kube             = { version = "4.0.0", features = ["runtime"] }
log              = "0.4.33"
mockall          = "0.15.0"
prometheus       = "0.14.0"

protobuf = { git = "https://github.com/bitdriftlabs/rust-protobuf.git", branch = "patch-stack", features = [
	"with-bytes",
] }
protobuf-codegen = { git = "https://github.com/bitdriftlabs/rust-protobuf.git", branch = "patch-stack" }
protobuf-json-mapping = { git = "https://github.com/bitdriftlabs/rust-protobuf.git", branch = "patch-stack" }

serde             = { version = "1.0.228", features = ["derive"] }
serde_dynamo      = "4.3.0"
serde_json        = { version = "1.0.150" }
serde_yaml        = "0.9.34"
sonyflake         = { git = "https://github.com/mattklein123/sonyflake-rs.git" }
thiserror         = "2.0.18"
tikv-jemallocator = "0.7.0"
time              = { version = "0.3.53", features = ["serde-well-known", "macros", "parsing"] }
tokio             = { version = "1.52.3", features = ["full"] }
tokio-stream      = "0.1.18"
uuid              = { version = "1.23.4", features = ["v4"] }
zstd              = "0.13.3"
