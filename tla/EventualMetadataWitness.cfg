\* Passing residual-safety check for the documented eventually consistent
\* metadata-loss scenario. The paired expected-failure configuration negates
\* EventualMetadataLoss to make TLC print the trace.

CONSTANTS
  Brokers = {BrokerA}
  Batches = {BatchA, BatchB}
  LeaseDuration = 4
  ReservationSize = 1
  MaxSequence = 2
  MaxTime = 3
  MaxLeaseTerm = 1
  MaxIncarnation = 0
  Null = NoValue
  WriterBroker = BrokerA
  LowerBatch = BatchA
  HigherBatch = BatchB
  VisibilityDelay = 1
  FastHorizon = 2

SPECIFICATION WitnessSpec

INVARIANT
  WitnessConstantsOK
  WitnessTypeOK
  LeaseFencing
  HighWaterNeverRegresses
  ReservationsDoNotOverlap
  AcceptedBatchesWereReserved
  BlobBeforeMetadata
  MetadataBeforeAcknowledgement
  PublishedMetadataHasAcceptanceProvenance
  ReaderCursorNeverRegresses
  DeliveredBatchesWerePublished
  SkippedBatchesAreCovered
  AllSkippedBatchesHaveKnownCause
