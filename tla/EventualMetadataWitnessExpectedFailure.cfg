\* This configuration is intentionally expected to fail.
\*
\* It runs the same phase-gated eventually consistent replica trace as the
\* residual-safety configuration, then negates EventualMetadataLoss so TLC
\* prints the exact accepted-loss counterexample.

CONSTANTS
  Brokers = {BrokerA}
  Batches = {BatchA, BatchB}
  LeaseDuration = 4
  ReservationSize = 1
  MaxSequence = 2
  MaxTime = 3
  MaxLeaseTerm = 1
  MaxIncarnation = 0
  Null = NoValue
  WriterBroker = BrokerA
  LowerBatch = BatchA
  HigherBatch = BatchB
  VisibilityDelay = 1
  FastHorizon = 2

SPECIFICATION WitnessSpec

INVARIANT
  WitnessConstantsOK
  WitnessTypeOK
  LeaseFencing
  HighWaterNeverRegresses
  ReservationsDoNotOverlap
  AcceptedBatchesWereReserved
  BlobBeforeMetadata
  MetadataBeforeAcknowledgement
  PublishedMetadataHasAcceptanceProvenance
  ReaderCursorNeverRegresses
  DeliveredBatchesWerePublished
  SkippedBatchesAreCovered
  AllSkippedBatchesHaveKnownCause
  NoEventualMetadataLoss
