\* This configuration is intentionally expected to fail.
\*
\* It uses the same phase-gated trace as StaleWriterWitness.cfg, checks all
\* residual safety invariants first, then negates the documented accepted loss.
\* TLC must report NoStaleWriterPublicationLoss and print the state trace.

CONSTANTS
  Brokers = {BrokerA, BrokerB}
  Batches = {BatchA, BatchB}
  LeaseDuration = 2
  ReservationSize = 1
  MaxSequence = 2
  MaxTime = 3
  MaxLeaseTerm = 2
  MaxIncarnation = 1
  Null = NoValue
  FormerBroker = BrokerA
  SuccessorBroker = BrokerB
  LowerBatch = BatchA
  HigherBatch = BatchB

SPECIFICATION WitnessSpec

INVARIANT
  WitnessConstantsOK
  WitnessTypeOK
  LeaseFencing
  HighWaterNeverRegresses
  ReservationsDoNotOverlap
  AcceptedBatchesWereReserved
  BlobBeforeMetadata
  MetadataBeforeAcknowledgement
  PublishedMetadataHasAcceptanceProvenance
  ReaderCursorNeverRegresses
  DeliveredBatchesWerePublished
  SkippedBatchesAreCovered
  AllSkippedBatchesHaveKnownCause
  NoStaleWriterPublicationLoss
