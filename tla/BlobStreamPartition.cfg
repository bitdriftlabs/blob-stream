\* This is the smallest ordinary TLC model configuration for Stage 2.
\*
\* A configuration supplies finite values for the constants declared in the
\* TLA+ module. TLC then explores every transition allowed by Spec for those
\* values. The symbolic names BrokerA and BatchA are TLC model values, not
\* strings that production code needs to understand.

CONSTANTS
  Brokers = {BrokerA, BrokerB}
  Batches = {BatchA, BatchB}
  LeaseDuration = 2
  ReservationSize = 1
  MaxSequence = 2
  MaxTime = 3
  MaxLeaseTerm = 2
  MaxIncarnation = 1
  Null = NoValue

\* TLC checks Spec and reports a counterexample trace if any listed invariant
\* becomes false. There is intentionally no liveness property in Stage 2.
SPECIFICATION Spec

INVARIANT
  TypeOK
  LeaseFencing
  HighWaterNeverRegresses
  ReservationsDoNotOverlap
  AcceptedBatchesWereReserved
  BlobBeforeMetadata
  MetadataBeforeAcknowledgement
  PublishedMetadataHasAcceptanceProvenance
