\* Passing residual-safety check for the documented stale-writer scenario.
\*
\* This configuration deliberately reaches StaleWriterPublicationLoss while
\* continuing to check the Stage 1-3 invariants. The paired expected-failure
\* configuration adds NoStaleWriterPublicationLoss to obtain TLC's trace.

CONSTANTS
  Brokers = {BrokerA, BrokerB}
  Batches = {BatchA, BatchB}
  LeaseDuration = 2
  ReservationSize = 1
  MaxSequence = 2
  MaxTime = 3
  MaxLeaseTerm = 2
  MaxIncarnation = 1
  Null = NoValue
  FormerBroker = BrokerA
  SuccessorBroker = BrokerB
  LowerBatch = BatchA
  HigherBatch = BatchB

SPECIFICATION WitnessSpec

INVARIANT
  WitnessConstantsOK
  WitnessTypeOK
  LeaseFencing
  HighWaterNeverRegresses
  ReservationsDoNotOverlap
  AcceptedBatchesWereReserved
  BlobBeforeMetadata
  MetadataBeforeAcknowledgement
  PublishedMetadataHasAcceptanceProvenance
  ReaderCursorNeverRegresses
  DeliveredBatchesWerePublished
  SkippedBatchesAreCovered
  AllSkippedBatchesHaveKnownCause
