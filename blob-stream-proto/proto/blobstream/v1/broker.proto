syntax = "proto3";

package blobstream.v1;

import "blobstream/v1/metadata.proto";

// Broker gRPC API used by producers to append batches of records.
service BrokerService {
  // Append a batch of records to a virtual partition and report persisted acceptance status.
  rpc ProduceBatch(ProduceBatchRequest) returns (ProduceBatchResponse);
  // Append multiple topic/virtual-partition batches to this broker.
  rpc ProduceBatches(ProduceBatchesRequest) returns (ProduceBatchesResponse);
  // Read bounded segment metadata for one topic window through the local broker cache.
  rpc ReadMetadataWindow(ReadMetadataWindowRequest) returns (ReadMetadataWindowResponse);
  // Read requested ranges from one immutable blob through the local broker cache.
  rpc ReadBlobRanges(ReadBlobRangesRequest) returns (ReadBlobRangesResponse);
}

// A single record in a producer batch.
message Record {
  // Opaque payload bytes (no schema validation in v1).
  bytes payload = 1;
  // Producer-provided event timestamp in milliseconds since Unix epoch.
  int64 event_ts_ms = 2;
}

// Persisted on-blob batch payload format used between broker flush and consumer read paths.
message StoredRecordBatch {
  // Owning virtual partition for this batch payload.
  uint32 virtual_partition_id = 1;
  // Records persisted in this batch.
  repeated Record records = 2;
}

// Request to append a batch of records for one virtual partition.
message ProduceBatchRequest {
  // Target topic name.
  string topic = 1;
  // Virtual partition identifier derived from (logical_partition_id + writer offset).
  uint32 virtual_partition_id = 2;
  // Records to append for the virtual partition.
  repeated Record records = 3;
}

// Response reporting whether the broker accepted and durably persisted the batch.
message ProduceBatchResponse {
  // Result status for the batch.
  ProduceStatus status = 1;
  // Optional error details when status is not OK.
  string error_message = 2;
}

// Request to append one or more independent producer batches to the same broker.
message ProduceBatchesRequest {
  // Non-empty batches to append. Responses preserve this order.
  repeated ProduceBatchRequest batches = 1;
}

// Results for a ProduceBatchesRequest.
message ProduceBatchesResponse {
  // One result per request batch, in the same order as the request.
  repeated ProduceBatchResponse results = 1;
}

// Status codes for broker responses.
enum ProduceStatus {
  // Batch accepted and metadata persisted.
  PRODUCE_STATUS_OK = 0;
  // Broker does not hold the lease for the virtual partition.
  PRODUCE_STATUS_NOT_LEASE_HOLDER = 1;
  // Topic not found in runtime configuration.
  PRODUCE_STATUS_UNKNOWN_TOPIC = 2;
  // Broker is overloaded; producer should retry with backoff.
  PRODUCE_STATUS_OVERLOADED = 3;
  // Request is invalid; producer should not retry it.
  PRODUCE_STATUS_BAD_REQUEST = 4;
}

// DynamoDB consistency required for one broker metadata read.
enum MetadataReadConsistency {
  METADATA_READ_CONSISTENCY_EVENTUAL = 0;
  METADATA_READ_CONSISTENCY_STRONG = 1;
}

// Failure class for one broker metadata read.
enum MetadataReadFailureStatus {
  // The request does not satisfy the metadata-cache contract and must not be retried unchanged.
  METADATA_READ_FAILURE_STATUS_BAD_REQUEST = 0;
  // The broker could not finish within its capacity or deadline budget; callers may retry.
  METADATA_READ_FAILURE_STATUS_OVERLOADED = 1;
  // The broker failed while reading or encoding metadata; callers may retry or fall back.
  METADATA_READ_FAILURE_STATUS_FAILED = 2;
}

// One virtual partition's inclusive lower Snowflake bound for a live-tail request.
message MetadataPartitionBound {
  // Virtual partition whose metadata must be included in the response.
  uint32 virtual_partition_id = 1;
  // Inclusive Snowflake lower bound for this virtual partition.
  uint64 min_snowflake = 2;
}

// Live-tail request coverage. The broker returns metadata at or after each partition's bound.
message TailMetadataCoverage {
  // One bound for every requested virtual partition. Duplicate partition identifiers are invalid.
  repeated MetadataPartitionBound partition_bounds = 1;
}

// Recovery request coverage. The broker returns the complete window for these partitions.
message FullRecoveryMetadataCoverage {
  // Requested virtual partitions. Duplicate partition identifiers are invalid.
  repeated uint32 virtual_partition_ids = 1;
}

// Broker metadata cache request for one aligned topic window.
message ReadMetadataWindowRequest {
  // Topic that owns the aligned metadata window.
  string topic = 1;
  // Start of the metadata window in Unix seconds. It must align to the topic window size.
  int64 window_start_unix_seconds = 2;
  // DynamoDB consistency required when the broker refills this coverage.
  MetadataReadConsistency consistency = 3;
  // Exactly one coverage mode is required. Tail bounds and recovery partitions are intentionally
  // separate because only a tail request has Snowflake lower bounds.
  oneof coverage {
    TailMetadataCoverage tail = 5;
    FullRecoveryMetadataCoverage full_recovery = 6;
  }
  // The caller's response budget. The server additionally enforces its configured maximum.
  uint64 max_response_bytes = 7;
}

// Metadata row returned by a broker read.
message BrokerSegmentMetadata {
  // Snowflake identifier used to order rows and apply tail lower bounds.
  uint64 snowflake_id = 1;
  // Lossless segment metadata payload used by the consumer read path.
  SegmentMetadataV1 metadata = 2;
}

// Successful broker metadata read result.
message MetadataReadSuccess {
  // Broker wall-clock time at which the backing store observation completed, in Unix milliseconds.
  int64 observed_at_unix_ms = 1;
  // Lowest Snowflake included by the backing-store refill, when the result is tail coverage.
  optional uint64 refill_floor = 2;
  // Monotonic broker-local cache generation that produced this result.
  uint64 generation = 3;
  // True when an eventual result came from retained cache coverage instead of a fresh refill.
  bool retained_coverage = 4;
  // Segment rows matching the requested partition coverage and caller response budget.
  repeated BrokerSegmentMetadata segments = 5;
}

// Failed broker metadata read result.
message MetadataReadFailure {
  // Typed failure class for fallback and retry decisions.
  MetadataReadFailureStatus status = 1;
  // Diagnostic detail. It is not stable for programmatic matching.
  string error_message = 2;
}

// Broker metadata cache response for one bounded request.
message ReadMetadataWindowResponse {
  // Exactly one result branch is present. A missing result is an invalid response.
  oneof result {
    MetadataReadSuccess success = 1;
    MetadataReadFailure failure = 2;
  }
}

// Failure class for one broker blob-range read.
enum BlobReadFailureStatus {
  // The request does not satisfy the blob-cache contract and must not be retried unchanged.
  BLOB_READ_FAILURE_STATUS_BAD_REQUEST = 0;
  // The broker cannot admit or encode the request before its deadline; callers may retry.
  BLOB_READ_FAILURE_STATUS_OVERLOADED = 1;
  // The complete blob exceeds the broker's whole-object cache read limit.
  BLOB_READ_FAILURE_STATUS_TOO_LARGE = 2;
  // Blob storage or broker processing failed; callers may retry or fall back.
  BLOB_READ_FAILURE_STATUS_STORAGE = 3;
  // The immutable blob no longer exists in blob storage.
  BLOB_READ_FAILURE_STATUS_NOT_FOUND = 4;
}

// One half-open byte range `[start, end)` within a blob.
message BlobRangeRequest {
  // Inclusive byte offset.
  uint64 start = 1;
  // Exclusive byte offset. `end` must be greater than `start`.
  uint64 end = 2;
}

// One raw compressed-byte range returned from an immutable blob.
message BlobRangeResult {
  // Exactly the requested compressed bytes. Results preserve request order.
  bytes payload = 1;
}

// Read requested ranges from one immutable blob through its selected local broker.
message ReadBlobRangesRequest {
  // Opaque immutable blob key. A request must not mix blob keys.
  string blob_key = 1;
  // Requested ranges in caller-defined order.
  repeated BlobRangeRequest ranges = 2;
}

// Complete successful range mapping for one ReadBlobRangesRequest.
message BlobReadSuccess {
  // Exactly one result for every requested range, preserving request order.
  repeated BlobRangeResult ranges = 1;
}

// Failed blob-range read result.
message BlobReadFailure {
  // Typed failure class for fallback and retry decisions.
  BlobReadFailureStatus status = 1;
  // Diagnostic detail. It is not stable for programmatic matching.
  string error_message = 2;
}

// Broker blob-cache response for one bounded blob-key request.
message ReadBlobRangesResponse {
  // Exactly one result branch is present. A missing result is an invalid response.
  oneof result {
    BlobReadSuccess success = 1;
    BlobReadFailure failure = 2;
  }
}
