syntax = "proto3";

package blobstream.v1;

import "google/protobuf/duration.proto";
import "validate/validate.proto";

// Broker process configuration shared across all topics.
message BrokerConfig {
  // Maximum aggregate raw record-payload bytes buffered per virtual partition before forcing a
  // flush. This is measured before protobuf encoding and before compression, and therefore is a
  // flush trigger rather than an upper bound on the resulting blob size.
  //
  // A flushed segment can contain multiple buffered batches. Each batch is protobuf encoded and
  // compressed independently, then the compressed batch payloads are concatenated into the
  // segment blob; the segment is not compressed as one whole payload.
  //
  // Default when unset/zero: 67,108,864 bytes (64 MiB).
  uint32 flush_max_bytes = 1;

  // Maximum time to wait before flushing buffered records, even if size is low.
  // Default when unset: 1 second.
  google.protobuf.Duration flush_max_delay = 2 [(validate.rules).duration.gt = {}];

  // Address to bind the broker listener (e.g. "0.0.0.0:8080").
  string bind_addr = 3 [(validate.rules).string.min_len = 1];

  // Node identity config used for lease holder ids.
  BrokerNodeIdentityConfig node_identity = 4 [(validate.rules).message.required = true];

  // Broker discovery config used to watch membership changes.
  BrokerDiscoveryConfig discovery = 5 [(validate.rules).message.required = true];

  // Compression strategy for stored segment payloads.
  // Default when unset: SEGMENT_COMPRESSION_ZSTD.
  optional SegmentCompression segment_compression = 6 [(validate.rules).enum.defined_only = true];

  // Writer ID / AZ isolation domain served by this broker deployment. This must be explicitly
  // configured even when the value is 0.
  optional uint32 writer_id = 7;

  // Base number of sequence values reserved from the lease store for each virtual partition.
  // The broker doubles its process-local target after out-of-cycle exhaustion and resets it on
  // ownership loss or restart. Default when unset: 10,000.
  optional uint32 sequence_reservation_size = 8;

  // Use a DynamoDB transaction to fence metadata publication against the active producer lease.
  // Default when unset: false.
  bool fenced_metadata_writes = 9;

  // Optional filesystem-backed runtime feature flags for the broker.
  BrokerFeatureFlagsConfig feature_flags = 10;

  // Producer-partition lease duration. Default when unset: 30 seconds.
  google.protobuf.Duration lease_duration = 11 [(validate.rules).duration.gt = {}];

  // Interval for renewing assigned producer-partition leases. Default when unset: 10 seconds.
  // This must be shorter than lease_duration.
  google.protobuf.Duration heartbeat_interval = 12 [(validate.rules).duration.gt = {}];
}

// Filesystem paths used to reload broker feature flags.
message BrokerFeatureFlagsConfig {
  // Directory to watch for updates, typically a Kubernetes ConfigMap mount.
  string dir = 1 [(validate.rules).string.min_len = 1];

  // YAML feature-flag file reloaded when the directory receives an update.
  string file = 2 [(validate.rules).string.min_len = 1];
}

// Compression strategy for stored segment payloads.
enum SegmentCompression {
  SEGMENT_COMPRESSION_NONE = 0;
  SEGMENT_COMPRESSION_ZSTD = 1;
}

// Node identity selection for brokers.
message BrokerNodeIdentityConfig {
  oneof source {
    option (validate.required) = true;

    // Explicit node identifier override.
    string static_id = 1 [(validate.rules).string.min_len = 1];

    // Use the runtime hostname as the node identifier.
    BrokerHostnameIdentity hostname = 2;
  }
}

// Hostname-based broker identity.
message BrokerHostnameIdentity {}

// Broker discovery configuration.
message BrokerDiscoveryConfig {
  oneof backend {
    option (validate.required) = true;

    // Static broker topology.
    StaticBrokerDiscoveryConfig static = 1;

    // Discover brokers via Kubernetes service endpoints.
    K8sServiceBrokerDiscoveryConfig k8s_service = 2;
  }
}

// Static broker discovery configuration.
message StaticBrokerDiscoveryConfig {
  repeated BrokerNode nodes = 1 [(validate.rules).repeated.min_items = 1];
}

// Broker node descriptor.
message BrokerNode {
  // Unique node identifier.
  string node_id = 1 [(validate.rules).string.min_len = 1];

  // Broker address (e.g. "10.0.0.1:8080").
  string address = 2 [(validate.rules).string.min_len = 1];
}

// Kubernetes service discovery configuration.
message K8sServiceBrokerDiscoveryConfig {
  // Namespace containing the broker service.
  string namespace = 1 [(validate.rules).string.min_len = 1];

  // Service name for the broker endpoints.
  string service_name = 2 [(validate.rules).string.min_len = 1];
}

// Per-topic configuration describing partitioning and retention.
message TopicConfig {
  // Unique topic name used by producers and consumers.
  string name = 1 [(validate.rules).string.min_len = 1];

  // Number of logical partitions for this topic.
  // No default; must be explicitly set to > 0.
  uint32 partition_count = 2 [(validate.rules).uint32.gt = 0];

  // Number of producer clusters that may write to this topic.
  // No default; must be explicitly set to > 0.
  uint32 num_writers = 3 [(validate.rules).uint32.gt = 0];

  // Retention window used to drive storage TTL and lifecycle policies.
  // Required and must be greater than zero.
  google.protobuf.Duration retention = 4 [
    (validate.rules).message.required = true,
    (validate.rules).duration.gt = {}
  ];

  // Maximum time from beginning segment construction until its metadata is durably written.
  // This includes segment encoding/compression, blob upload, and metadata persistence.
  // Default when unset: 15 seconds. Brokers enforce this deadline and consumers use it to derive
  // the finite steady-state metadata scan horizon.
  google.protobuf.Duration max_metadata_publication_lag = 5 [(validate.rules).duration.gt = {}];

  // Fixed window size used to construct durable metadata keys. Brokers publish and consumers scan
  // using this shared topic value. It defines the metadata-key layout for the topic.
  //
  // Default when unset: 300 seconds (5 minutes).
  //
  // This controls how segment metadata is bucketed and therefore how many distinct Dynamo partition
  // keys are touched by reads:
  // - Smaller windows => more keys/windows to scan per hour, lower per-window fan-in.
  // - Larger windows => fewer keys/windows to scan per hour, higher per-window fan-in.
  //
  // Practical tuning:
  // - Keep this at 300s unless you have a clear need; it is a good cost/latency baseline.
  // - Decrease (e.g., 60-120s) if you need tighter visibility granularity and can accept more
  //   metadata scan overhead.
  // - Increase (e.g., 600-900s) if throughput is very high and you want fewer Dynamo partition-key
  //   scans, accepting coarser scan buckets.
  //
  google.protobuf.Duration metadata_window_size = 6 [(validate.rules).duration.gt = {}];
}

// In-memory blob store configuration (used for tests/local runs).
message InMemoryBlobStoreConfig {}

// S3-backed blob store configuration.
message S3BlobStoreConfig {
  // S3 bucket name for blob segments.
  string bucket = 1 [(validate.rules).string.min_len = 1];

  // Optional prefix for blob objects (e.g., "blob-stream/").
  string prefix = 2;

  // AWS region (e.g., "us-east-1").
  string region = 3 [(validate.rules).string.min_len = 1];

  // Optional endpoint override for local testing (e.g., LocalStack).
  string endpoint = 4;
}

// Blob store configuration selection.
message BlobStoreConfig {
  oneof backend {
    option (validate.required) = true;

    InMemoryBlobStoreConfig in_memory = 1;
    S3BlobStoreConfig s3 = 2;
  }
}

// In-memory metadata store configuration (used for tests/local runs).
message InMemoryMetadataStoreConfig {}

// DynamoDB-backed metadata store configuration.
message DynamoMetadataStoreConfig {
  // AWS region (e.g., "us-east-1").
  string region = 1 [(validate.rules).string.min_len = 1];

  // Optional endpoint override for local testing (e.g., LocalStack).
  string endpoint = 2;

  // DynamoDB table name for segment metadata (`blob_segments`).
  string segment_metadata_table_name = 3 [(validate.rules).string.min_len = 1];

  // DynamoDB table name for producer partition leases (`producer_partition_leases`).
  string producer_partition_lease_table_name = 4 [(validate.rules).string.min_len = 1];

  // DynamoDB table name for consumer group leases (`consumer_group_leases`).
  string consumer_group_lease_table_name = 5 [(validate.rules).string.min_len = 1];

  // DynamoDB table name for consumer group membership (`consumer_group_membership`).
  string consumer_group_membership_table_name = 6 [(validate.rules).string.min_len = 1];

  // Additional time added to segment metadata TTL beyond topic retention.
  // Default when unset: 1 hour.
  google.protobuf.Duration segment_ttl_buffer = 7 [(validate.rules).duration.gt = {}];

  // Additional time added to lease/membership TTL beyond lease expiration.
  // Default when unset: 1 hour.
  google.protobuf.Duration lease_ttl_buffer = 8 [(validate.rules).duration.gt = {}];
}

// Metadata store configuration selection.
message MetadataStoreConfig {
  oneof backend {
    option (validate.required) = true;

    InMemoryMetadataStoreConfig in_memory = 1;
    DynamoMetadataStoreConfig dynamo = 2;
  }
}

// Runtime configuration for a broker process.
message RuntimeConfig {
  // Broker-wide settings applied across all topics.
  BrokerConfig broker = 1 [(validate.rules).message.required = true];

  // Topic definitions available to this broker.
  repeated TopicConfig topics = 2 [(validate.rules).repeated.min_items = 1];

  // Blob storage configuration for segments.
  BlobStoreConfig blob_store = 3 [(validate.rules).message.required = true];

  // Metadata storage configuration for segment indexes.
  MetadataStoreConfig metadata_store = 4 [(validate.rules).message.required = true];
}

// Producer-side compression for gRPC requests.
enum ProducerCompression {
  PRODUCER_COMPRESSION_NONE = 0;
  PRODUCER_COMPRESSION_SNAPPY = 1;
}

// Producer client settings.
message ProducerConfig {
  // Writer id in range [0, num_writers) for each configured topic.
  // Default when unset: 0.
  optional uint32 writer_id = 1;

  // Maximum records in a producer-side batch.
  // Default when unset: 1,000 records.
  optional uint32 max_batch_records = 2 [(validate.rules).uint32.gt = 0];

  // Maximum uncompressed payload bytes in a producer-side batch.
  // Default when unset: 1,048,576 bytes (1 MiB).
  optional uint32 max_batch_bytes = 3 [(validate.rules).uint32.gt = 0];

  // Maximum delay before time-based flush. Default when unset: 200 ms.
  google.protobuf.Duration flush_max_delay = 4 [(validate.rules).duration.gt = {}];

  // Exponential backoff base delay. Default when unset: 25 ms.
  google.protobuf.Duration retry_base_delay = 6 [(validate.rules).duration.gt = {}];

  // Exponential backoff max delay. Default when unset: 1 second.
  google.protobuf.Duration retry_max_delay = 7 [(validate.rules).duration.gt = {}];

  // gRPC connect timeout. Default when unset: 2 seconds.
  google.protobuf.Duration connect_timeout = 8 [(validate.rules).duration.gt = {}];

  // gRPC request timeout. Default when unset: 5 seconds.
  google.protobuf.Duration request_timeout = 9 [(validate.rules).duration.gt = {}];

  // Maximum in-flight request concurrency.
  // Default when unset: 64.
  optional uint64 max_request_concurrency = 10 [(validate.rules).uint64.gt = 0];

  // Request compression strategy.
  // Default when unset: PRODUCER_COMPRESSION_NONE.
  optional ProducerCompression compression = 11 [(validate.rules).enum.defined_only = true];

  // Maximum total time spent retrying one producer batch, including retry delays and RPCs.
  // Default when unset: 30 seconds.
  google.protobuf.Duration retry_deadline = 12 [(validate.rules).duration.gt = {}];
}

// Runtime configuration for producer clients.
message ProducerRuntimeConfig {
  // Producer behavior/tuning parameters.
  ProducerConfig producer = 1 [(validate.rules).message.required = true];

  // Broker discovery backend (static or k8s service).
  BrokerDiscoveryConfig discovery = 2 [(validate.rules).message.required = true];

  // Topic definitions used by producer routing and validation.
  repeated TopicConfig topics = 3 [(validate.rules).repeated.min_items = 1];
}

// Consumer read path settings.
message ConsumerReadConfig {
  // Topic to scan for segment metadata.
  string topic = 1 [(validate.rules).string.min_len = 1];

  // Base idle poll delay when no batches are available. Default when unset: 250 ms.
  google.protobuf.Duration idle_poll_delay = 4 [(validate.rules).duration.gt = {}];

  // Optional max idle poll delay for exponential backoff.
  // Default when unset: 2,000 ms. With the default base delay, empty polls wait 250 ms, 500 ms,
  // 1,000 ms, then 2,000 ms until data arrives.
  google.protobuf.Duration max_idle_poll_delay = 5 [(validate.rules).duration.gt = {}];

  // RAM budget for consumer-owned decoded payload buffering.
  // Default when unset: 67,108,864 bytes (64 MiB).
  //
  // The consumer iterator reserves payload capacity before it reads a batch and accounts for
  // decoded batches awaiting delivery. One oversized batch may be read only when no payload is
  // otherwise retained; prefetch then pauses until callers drain it.
  //
  // Tuning guidance:
  // - Increase to reduce foreground `next()` latency and improve burst absorption.
  // - Decrease to reduce process memory footprint when running many consumers per host.
  optional uint64 prefetch_max_bytes = 6 [(validate.rules).uint64.gt = 0];

  // Delay accepting recently published metadata rows while using eventually consistent reads.
  // Default when unset: 2,000 ms. This is a best-effort staleness margin, not a
  // consistency guarantee because the metadata store has no bounded replication delay.
  google.protobuf.Duration metadata_visibility_delay = 9 [(validate.rules).duration.gte = {}];

  // Maximum number of batch byte-range reads and decodes that may run concurrently.
  // Default when unset: 32.
  //
  // This controls I/O and temporary decode-memory parallelism, while prefetch_max_bytes controls
  // total consumer-owned payload capacity. Increase only after confirming object-store and host
  // capacity can sustain the additional concurrent work.
  optional uint64 max_in_flight_batch_reads = 10 [(validate.rules).uint64.gt = 0];

  // Read metadata from DynamoDB with strong consistency. Default when unset: false.
  // Strong reads remove read-replica staleness but do not fence stale producer publication.
  optional bool strongly_consistent_metadata_reads = 11;

  // Maximum pairwise amount by which this consumer clock may lead a broker clock. This must cover
  // time-source uncertainty and is included in the metadata availability horizon.
  // Default when unset: 10 ms. Set this to a proven, monitored deployment bound; it is not a
  // universal NTP guarantee.
  google.protobuf.Duration max_clock_skew = 12 [(validate.rules).duration.gt = {}];
}

// Consumer group lease and heartbeat settings.
message ConsumerGroupConfig {
  // Topic for the consumer group lease domain.
  string topic = 1 [(validate.rules).string.min_len = 1];

  // Consumer group id.
  string group_id = 2 [(validate.rules).string.min_len = 1];

  // Stable member id for this consumer instance.
  string member_id = 3 [(validate.rules).string.min_len = 1];

  // Lease duration. Default when unset: 30 seconds.
  google.protobuf.Duration lease_duration = 4 [(validate.rules).duration.gt = {}];

  // Heartbeat interval. Default when unset: 10 seconds.
  google.protobuf.Duration heartbeat_interval = 5 [(validate.rules).duration.gt = {}];

  // Rebalance interval. Default when unset: 10 seconds.
  google.protobuf.Duration rebalance_interval = 6 [(validate.rules).duration.gt = {}];

  // Stable physical pod identity for hierarchical consumer assignment.
  // When unset, the group uses member-only assignment for compatibility.
  optional string pod_id = 7 [(validate.rules).string.min_len = 1];
}

// Runtime configuration for consumer library applications.
message ConsumerRuntimeConfig {
  // Read path configuration.
  ConsumerReadConfig read = 1 [(validate.rules).message.required = true];

  // Group coordination configuration.
  ConsumerGroupConfig group = 2 [(validate.rules).message.required = true];
}

// Single-message bootstrap config for creating a production-ready consumer iterator.
message ConsumerIteratorBootstrapConfig {
  // Consumer runtime behavior/tuning.
  ConsumerRuntimeConfig runtime = 1 [(validate.rules).message.required = true];

  // Topic shape used to derive virtual partitions.
  TopicConfig topic = 2 [(validate.rules).message.required = true];

  // Blob storage backend used by consumer reads.
  BlobStoreConfig blob_store = 3 [(validate.rules).message.required = true];

  // Metadata and lease storage backend used by reads/coordination.
  MetadataStoreConfig metadata_store = 4 [(validate.rules).message.required = true];
}
